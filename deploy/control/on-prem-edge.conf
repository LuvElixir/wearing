limit_req_zone $binary_remote_addr zone=pajio_requests:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=pajio_connections:10m;
map $http_upgrade $pajio_upgrade { default upgrade; "" close; }
server {
 listen 80;
 server_name pajio.luckyloading.com id.pajio.luckyloading.com;
 access_log off;
 location ^~ /.well-known/acme-challenge/ { root /var/www/pajio-acme; }
 location / { return 301 https://$host$request_uri; }
}
server {
listen 443 ssl;
 ssl_certificate /etc/letsencrypt/live/pajio.luckyloading.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/pajio.luckyloading.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 error_log /dev/null;
 client_max_body_size 20m;
 client_body_timeout 15s;
 client_header_timeout 10s;
 limit_conn pajio_connections 12;
 limit_req zone=pajio_requests burst=30 nodelay;
 limit_req_status 429;
 proxy_ssl_trusted_certificate /etc/pajio/tls/ca.crt;
 proxy_ssl_certificate /etc/pajio/tls/gateway-client.crt;
 proxy_ssl_certificate_key /etc/pajio/tls/gateway-client.key;
 proxy_ssl_verify on;
 proxy_ssl_verify_depth 2;
 proxy_ssl_name control.pajio.internal;
 proxy_ssl_session_reuse on;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-Proto https;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $pajio_upgrade;
 proxy_read_timeout 240s;
 proxy_connect_timeout 10s;
 proxy_buffering off;
 add_header Referrer-Policy no-referrer always;
 add_header X-Content-Type-Options nosniff always;
 add_header Cache-Control "no-store" always;
server_name pajio.luckyloading.com;
 location ^~ /internal/ { return 404; }
 location / { proxy_pass https://10.66.66.111:8443; }
}
