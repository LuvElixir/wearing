map $http_upgrade $pajio_connection { default upgrade; "" close; }
server {
listen 10.66.66.111:8443 ssl;
 ssl_certificate /etc/pajio/tls/control.crt;
 ssl_certificate_key /etc/pajio/tls/control.key;
 ssl_client_certificate /etc/pajio/tls/ca.crt;
 ssl_verify_client on;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 client_max_body_size 20m;
 client_body_timeout 15s;
 proxy_read_timeout 240s;
 proxy_send_timeout 30s;
 proxy_buffering off;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $pajio_connection;
 proxy_set_header X-Forwarded-Proto https;
 server_name pajio.luckyloading.com;
 location / { proxy_pass http://127.0.0.1:8780; }
}
