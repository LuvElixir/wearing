  <h1 id="heading">我在这里。</h1>
  <p class="intro" id="intro">连接上，我们就能接着聊，也能接着记。</p>
  <form id="connection-form">
    <label for="server">Pajio 地址</label>

    <p class="help">本机服务或你的私人 Pajio 地址。首次连接正式服务时，会先打开官方登录页面，登录后会自动回到 Pajio。</p>
    <button id="connect" type="submit">连接 Pajio</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="footnote" id="shortcut"></p>
  <p class="footnote">关闭窗口或退出客户端不会停止后台任务。要暂停一件事，可以回到 Pajio 里操作。</p>
