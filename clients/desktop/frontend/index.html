<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wearing</title><link rel="stylesheet" href="connection.css"><script src="connection.js" defer></script></head>
<body>
<!--
THESIS: Wearing remains reachable from the desktop; connection recovery keeps the same records and companion.
OWN-WORLD: Extend the existing cobalt sleeve avatar, outlined wordmark, near-white surfaces, 14px controls and native reading fonts.
STORY: Recognize Wearing, connect the existing service, continue the same life records; failures keep the last connection and offer a retry.
FIRST VIEWPORT: A 460px reading column, unchanged wordmark and 112px avatar, address field and one 46px primary action, shortcut and close behavior below.
FORM: Existing-world Operate extension, a quiet connection page inside standard OS chrome. No replacement world or generated comp.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<main>
  <img class="wordmark" src="wordmark.svg" width="132" height="35" alt="Wearing">
  <img class="companion" src="companion-portrait.png" width="112" height="112" alt="Wearing 在这里">
  <h1 id="heading">我在这里。</h1>
  <p class="intro" id="intro">连接上，我们就能接着聊，也能接着记。</p>
  <form id="connection-form">
    <label for="server">Wearing 地址</label>
    <input id="server" type="url" required maxlength="2000" value="http://127.0.0.1:8765/" autocomplete="url" spellcheck="false">
    <p class="help">本机服务或你的私人 Wearing 地址。</p>
    <button id="connect" type="submit">连接 Wearing</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="footnote" id="shortcut"></p>
  <p class="footnote">关闭窗口或退出客户端不会停止后台任务。要暂停一件事，可以回到 Wearing 里操作。</p>
</main>
</body></html>
